<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book Appointment: ASW Law Advocates LLP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f9fafc}
*{box-sizing:border-box}
a{text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #01d4ff;outline-offset:3px;border-radius:4px}
.band{background-color:#0a1f4e;background-image:linear-gradient(90deg,rgba(10,31,78,0.97) 0%,rgba(10,31,78,0.86) 50%,rgba(10,31,78,0.97) 100%),url(../assets/hero.jpg);background-size:cover;background-position:center}
.field{width:100%;min-height:48px;padding:12px 16px;background:#ffffff;border:1px solid #d5d9e2;border-radius:4px;font-family:inherit;font-size:16px;line-height:24px;color:#0a1f4e}
.field:focus{outline:2px solid #01d4ff;outline-offset:1px;border-color:#0a1f4e}
.field::placeholder{color:#5e6c8b}
.submit:hover{background:#08193e !important}
.info-link:hover{color:#01d4ff !important}
.wa:hover{transform:scale(1.06)}
</style>
</helmet>
<div style="width:100%;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:#0a1f4e;background:#f9fafc">

<dc-import name="Header" active="book" hint-size="100%,124px"></dc-import>

<section class="band" style="color:#f9fafc;text-align:center">
  <div style="max-width:1200px;margin:0 auto;padding:72px 32px 68px;display:flex;flex-direction:column;align-items:center;gap:20px">
    <h1 style="margin:0;font-size:clamp(36px,4.6vw,56px);line-height:1.05;font-weight:600;letter-spacing:-1px;color:#f9fafc">Book Appointment</h1>
    <span style="display:block;width:56px;height:3px;background:#01d4ff"></span>
  </div>
</section>

<section style="padding:88px 0 112px">
  <div style="max-width:1200px;margin:0 auto;padding:0 32px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:32px;align-items:stretch">

      <!-- Office details -->
      <aside style="background:#0a1f4e;color:#f9fafc;border-radius:8px;padding:40px 36px;display:flex;flex-direction:column;gap:32px">
        <div style="display:flex;gap:16px;align-items:flex-start">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#01d4ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <div>
            <div style="font-size:18px;line-height:24px;font-weight:600">Office Hours</div>
            <div style="margin-top:4px;font-size:15px;line-height:24px">Mon to Fri: 9.00am to 5.00pm</div>
          </div>
        </div>
        <div style="display:flex;gap:16px;align-items:flex-start">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#01d4ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <div>
            <div style="font-size:18px;line-height:24px;font-weight:600">Phone:</div>
            <a class="info-link" href="tel:+254788685911" style="display:inline-block;margin-top:4px;font-size:15px;line-height:24px;color:#f9fafc">+254 788 685 911</a>
          </div>
        </div>
        <div style="display:flex;gap:16px;align-items:flex-start">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#01d4ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <div>
            <div style="font-size:18px;line-height:24px;font-weight:600">Address:</div>
            <div style="margin-top:4px;font-size:15px;line-height:24px">Tourism Fund Building, Mezzanine Floor, Office M08, Off-Bishop Rd, Community Area, Nairobi, Kenya</div>
          </div>
        </div>
        <div style="display:flex;gap:16px;align-items:flex-start">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#01d4ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <div>
            <div style="font-size:18px;line-height:24px;font-weight:600">Email:</div>
            <a class="info-link" href="mailto:info@aswlaw.africa" style="display:inline-block;margin-top:4px;font-size:15px;line-height:24px;color:#f9fafc">info@aswlaw.africa</a>
          </div>
        </div>
      </aside>

      <!-- Booking form -->
      <form onSubmit="{{submit}}" style="background:#ffffff;border:1px solid #d5d9e2;border-radius:8px;padding:40px 36px;display:flex;flex-direction:column;gap:22px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:22px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <label for="bk-name" style="font-size:14px;line-height:20px;font-weight:600;color:#0a1f4e">Your name</label>
            <input id="bk-name" class="field" type="text" autocomplete="name">
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label for="bk-email" style="font-size:14px;line-height:20px;font-weight:600;color:#0a1f4e">Your email</label>
            <input id="bk-email" class="field" type="email" autocomplete="email">
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="bk-area" style="font-size:14px;line-height:20px;font-weight:600;color:#0a1f4e">Area of practice</label>
          <select id="bk-area" class="field">
            <option>Dispute Resolution</option>
            <option>Commercial and Corporate</option>
            <option>Public Procurement and Tax</option>
            <option>Property &amp; Real Estate</option>
            <option>Private Client</option>
            <option>Employment and Pensions</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="bk-date" style="font-size:14px;line-height:20px;font-weight:600;color:#0a1f4e">Preferred date</label>
          <input id="bk-date" class="field" type="date">
        </div>
        <div role="group" aria-labelledby="bk-time-label" style="display:flex;flex-direction:column;gap:10px">
          <span id="bk-time-label" style="font-size:14px;line-height:20px;font-weight:600;color:#0a1f4e">Preferred time</span>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <sc-for list="{{slots}}" as="s" hint-placeholder-count="7">
              <button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="bk-msg" style="font-size:14px;line-height:20px;font-weight:600;color:#0a1f4e">Your message (optional)</label>
          <textarea id="bk-msg" class="field" rows="4" style="resize:vertical"></textarea>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
          <button class="submit" type="submit" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 32px;background:#0a1f4e;color:#f9fafc;border:0;border-radius:4px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer">
            <span>Book Appointment</span>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
          <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
            <span role="status" style="font-size:15px;line-height:22px;font-weight:600;color:#157a35">Request received. We will confirm your appointment shortly.</span>
          </sc-if>
        </div>
      </form>
    </div>
  </div>
</section>

<dc-import name="Footer" hint-size="100%,600px"></dc-import>

<div style="position:sticky;bottom:24px;height:0;display:flex;justify-content:flex-end;padding-right:24px;z-index:20">
  <a class="wa" href="https://wa.me/254788685911" aria-label="Chat with ASW Law Advocates on WhatsApp" style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin-top:-80px;border-radius:9999px;background:#25d366;box-shadow:0 8px 24px rgba(10,31,78,0.28);transition:transform .2s ease">
    <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-4.9A8.5 8.5 0 1 1 8 19.4L3 21z"/><path d="M9 8.6c.2 2.7 2.6 5.4 5.6 5.9l1.2-1.3c.2-.2.5-.3.8-.2l1.5.6c.3.1.5.4.4.7-.4 1.2-1.6 1.9-2.8 1.8-3.8-.4-7-3.5-7.4-7.2-.1-1.2.6-2.3 1.8-2.6.3-.1.6.1.7.4l.6 1.5c.1.3 0 .6-.2.8L9 8.6z" fill="#ffffff" stroke="none"/></svg>
  </a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slot: '10.00am', sent: false };
  }
  renderVals() {
    const labels = ['9.00am', '10.00am', '11.00am', '12.00pm', '2.00pm', '3.00pm', '4.00pm'];
    const base = "min-height:44px;padding:0 18px;border-radius:4px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border:1px solid ";
    const slots = labels.map((l) => {
      const on = this.state.slot === l;
      return {
        label: l,
        pressed: on,
        style: on
          ? base + "#0a1f4e;background:#0a1f4e;color:#f9fafc"
          : base + "#d5d9e2;background:#ffffff;color:#0a1f4e",
        pick: () => this.setState({ slot: l, sent: false })
      };
    });
    return {
      slots,
      sent: this.state.sent,
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
